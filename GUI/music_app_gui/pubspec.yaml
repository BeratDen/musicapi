name: music_app_gui
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.1.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  just_audio: ^0.9.36
  just_audio_mpv: ^0.1.7
  just_audio_windows: ^0.2.0
  provider: ^6.1.1
  dio_cookie_manager: ^3.1.1
  dio: ^5.4.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.2
  flutter_form_builder: ^9.2.1
  form_builder_validators: ^9.1.0
  skeletonizer: ^1.1.1
  file_picker: ^8.0.0+1
  gcloud: ^0.8.12
  image_picker: ^1.0.7
  googleapis_auth: ^1.5.1
  mime: ^1.0.5
  google_fonts: ^5.1.0
  flutter_resizable_container: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - public/
    - public/images/
    - assets/credentials.json
    - google_fonts/
